# Keeps the NODE RUN leaderboard's Supabase project out of the free-tier
# auto-pause (paused after 7 days with zero API requests). 1–3 times a day:
#   1. GET the scores board (read) — cheap, matches normal traffic.
#      If the read fails (paused projects lose DNS entirely), self-heal:
#      call the Supabase Management API to restore the project, then wait
#      for it to come back. Needs the SUPABASE_ACCESS_TOKEN repo secret —
#      a personal access token from supabase.com/dashboard/account/tokens.
#   2. Upsert the single row in `keepalive` (write) — a real write is a much
#      stronger "this project is alive" signal than a read alone, and
#      doubles as a smoke test that the insert/RLS path still works.
#      Table + policies: scripts/keepalive-table.sql (run once in Supabase).
#   3. Commit a timestamp file back to the repo — but only when the last
#      push is over 7 days old, so frequent runs don't spam the history.
#
# So the traffic doesn't look like a metronome (same minute every day),
# the schedule is jittered:
#   - The 04:17 UTC slot ALWAYS pings — that's the daily guarantee, and the
#     slot that catches a pause overnight.
#   - The 11:43 and 20:09 slots each ping with ~50% probability.
#   - Every scheduled run first sleeps a random 0–50 minutes.
# Net effect: 1–3 pings/day (2 on average) at times that drift run to run.
# Manual runs (workflow_dispatch) never skip and never sleep.
#
# Step 3 matters for a reason unrelated to Supabase: GitHub disables
# *scheduled* workflows after 60 days with no repository activity (pushes),
# even if the workflow itself has been running fine on schedule the whole
# time. An occasional small commit counts as repo activity, so it resets
# that clock — the workflow keeps itself enabled indefinitely.
#
# LB.url / LB.anonKey below match the values in play.js. The anon key is a
# public/publishable key by design (see MAINTAINING.md §9) — safe to commit.

name: Keepalive (Supabase + workflow schedule)

on:
  schedule:
    - cron: "17 4 * * *" # anchor slot — always pings
    - cron: "43 11 * * *" # ~50% of days
    - cron: "9 20 * * *" # ~50% of days
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: keepalive
  cancel-in-progress: false

env:
  LB_URL: https://ktpjbqmlapmqshyjrzji.supabase.co
  LB_ANON_KEY: sb_publishable_nBZJyXI8Xj-XVjXVXR4VRw_6bPw8dsm
  PROJECT_REF: ktpjbqmlapmqshyjrzji
  ANCHOR_CRON: "17 4 * * *"

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Decide whether to ping this run (and jitter the time)
        id: gate
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "Manual run — no skip, no jitter."
            echo "go=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "${{ github.event.schedule }}" != "$ANCHOR_CRON" ] && [ $((RANDOM % 2)) -eq 0 ]; then
            echo "Optional slot lost the coin flip — skipping this run."
            echo "go=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          jitter=$((RANDOM % 3000))
          echo "Sleeping ${jitter}s of jitter before pinging."
          sleep "$jitter"
          echo "go=true" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.gate.outputs.go == 'true'

      - name: Ping leaderboard (read)
        id: read
        if: steps.gate.outputs.go == 'true'
        continue-on-error: true
        run: |
          curl -fsS "$LB_URL/rest/v1/scores?select=id&limit=1" \
            -H "apikey: $LB_ANON_KEY" \
            -H "Authorization: Bearer $LB_ANON_KEY" \
            -o /dev/null

      - name: Restore paused project (self-heal)
        if: steps.read.outcome == 'failure'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Read ping failed and SUPABASE_ACCESS_TOKEN is not set — cannot auto-restore. Create a token at supabase.com/dashboard/account/tokens and add it with: gh secret set SUPABASE_ACCESS_TOKEN"
            exit 1
          fi
          echo "Read ping failed — assuming the project is paused; requesting a restore."
          curl -fsS -X POST "https://api.supabase.com/v1/projects/$PROJECT_REF/restore" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{}'
          echo "Restore requested; polling until the API answers (up to 20 min)."
          for i in $(seq 1 40); do
            sleep 30
            if curl -fsS "$LB_URL/rest/v1/scores?select=id&limit=1" \
                 -H "apikey: $LB_ANON_KEY" \
                 -H "Authorization: Bearer $LB_ANON_KEY" \
                 -o /dev/null; then
              echo "Project is back up after ~$((i * 30))s."
              exit 0
            fi
          done
          echo "::error::Project did not come back within 20 minutes — check the Supabase dashboard."
          exit 1

      - name: Ping keepalive row (write)
        if: steps.gate.outputs.go == 'true'
        run: |
          now="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          curl -fsS "$LB_URL/rest/v1/keepalive?on_conflict=id" \
            -H "apikey: $LB_ANON_KEY" \
            -H "Authorization: Bearer $LB_ANON_KEY" \
            -H "Content-Type: application/json" \
            -H "Prefer: resolution=merge-duplicates,return=minimal" \
            -d "{\"id\":1,\"pinged_at\":\"$now\"}"

      - name: Record last run (keeps this schedule from being auto-disabled)
        if: steps.gate.outputs.go == 'true'
        run: |
          head_age=$(( $(date +%s) - $(git log -1 --format=%ct) ))
          if [ "$head_age" -lt $((7 * 24 * 3600)) ]; then
            echo "Last push is under 7 days old; skipping the activity commit."
            exit 0
          fi
          mkdir -p .github
          date -u +%Y-%m-%dT%H:%M:%SZ > .github/keepalive-log.txt
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/keepalive-log.txt
          git diff --cached --quiet || git commit -m "chore: keepalive ping $(date -u +%Y-%m-%d)"
          git push
