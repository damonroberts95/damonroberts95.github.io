# Rebuilds posts/index.json from the post files, then deploys to Pages.
# Runs on every push to main. You only ever add/edit a posts/*.md file —
# this keeps the index in sync automatically.

name: Build & deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Opt JS actions into the Node 24 runtime (Node 20 deprecated June 2026).
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build posts index
        run: node scripts/build-index.mjs

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
